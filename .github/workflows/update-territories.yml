name: Update Territories

on:
  schedule:
    - cron: '3-58/5 9-23 * * 6'
      timezone: 'America/Los_Angeles'
    - cron: '3-58/5 0-2 * * 0'
      timezone: 'America/Los_Angeles'
    # Daily refresh for late finals and corrections.
    - cron: '17 3 * * 1-5'
      timezone: 'America/Los_Angeles'

  # Allow manual trigger with season parameter
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (e.g., 2026)'
        required: false
        default: '2026'
      force_update:
        description: 'Force update even if no changes'
        required: false
        default: 'false'

env:
  SEASON: 2026
  PYTHON_VERSION: '3.11'

concurrency:
  group: territory-data-update
  cancel-in-progress: false

jobs:
  update-territories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_SEASON: ${{ github.event.inputs.season || '' }}
      INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update || '' }}
    permissions:
      contents: write  # Allow pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Resolve run parameters
        id: resolve-params
        run: |
          if [ -n "$INPUT_SEASON" ]; then
            season="$INPUT_SEASON"
          else
            season="$SEASON"
          fi

          echo "EFFECTIVE_SEASON=$season" >> "$GITHUB_ENV"
          echo "effective_season=$season" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FORCE_UPDATE" = "true" ]; then
            force="true"
          else
            force="false"
          fi

          echo "FORCE_UPDATE=$force" >> "$GITHUB_ENV"
          echo "force_update=$force" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "INGEST_SCOPE=--active-only" >> "$GITHUB_ENV"
          else
            echo "INGEST_SCOPE=" >> "$GITHUB_ENV"
          fi

      - name: Ingest game results
        run: |
          cd backend
          echo "🏈 Fetching game results for season $EFFECTIVE_SEASON..."
          python ingest_games.py --season $EFFECTIVE_SEASON --season-type both --provider espn $INGEST_SCOPE
          echo "✓ Game results ingested"

      - name: Check for completed-game changes
        id: game-changes
        run: |
          if [ -n "$(git status --porcelain -- frontend/public/data/games/${EFFECTIVE_SEASON}/)" ]; then
            echo "has_game_changes=true" >> "$GITHUB_OUTPUT"
            echo "🏁 New or corrected completed-game data detected"
          else
            echo "has_game_changes=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Completed-game data is unchanged; skipping generation"
          fi

      - name: Apply territory transfers
        if: >
          steps.game-changes.outputs.has_game_changes == 'true' ||
          steps.resolve-params.outputs.force_update == 'true'
        run: |
          cd backend
          echo "🗺️  Applying territory transfers..."
          python apply_transfers.py --season $EFFECTIVE_SEASON
          echo "✓ Territory transfers applied"

      - name: Publish live manifest
        if: >
          steps.game-changes.outputs.has_game_changes == 'true' ||
          steps.resolve-params.outputs.force_update == 'true'
        run: |
          cd backend
          python publish_live_manifest.py --season $EFFECTIVE_SEASON

      - name: Validate generated data
        if: >
          steps.game-changes.outputs.has_game_changes == 'true' ||
          steps.resolve-params.outputs.force_update == 'true'
        working-directory: frontend
        run: npm run validate-data

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain frontend/public/data/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📊 Changes detected in data files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes to commit"
          fi

      - name: Commit and push changes
        if: >
          steps.check-changes.outputs.has_changes == 'true' ||
          steps.resolve-params.outputs.force_update == 'true'
        run: |
          # Get the current week number from the latest ownership file
          LATEST_WEEK=$(ls -1 frontend/public/data/ownership/${EFFECTIVE_SEASON}/ 2>/dev/null | grep -E 'week-[0-9]+\.json$' | sort -V | tail -1 | grep -oP 'week-\K[0-9]+' || echo "unknown")

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            FREQUENCY="live"
          else
            FREQUENCY="manual"
          fi

          git add frontend/public/data/

          git commit \
            -m "Update territories for week ${LATEST_WEEK} (${FREQUENCY} update)" \
            -m "- Ingested latest game results" \
            -m "- Applied territory transfers" \
            -m "- Updated leaderboards" \
            -m "" \
            -m "🤖 Automated update via GitHub Actions" \
            || echo "No changes to commit"

          git push

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Update Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Season: $EFFECTIVE_SEASON"
          echo "Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Time (local): $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Completed games changed: ${{ steps.game-changes.outputs.has_game_changes }}"
          echo "Changes detected: ${{ steps.check-changes.outputs.has_changes }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Territory update failed. Check workflow logs for details."

name: Update Territories

on:
  # In-season cadence: hourly on game day and daily for late finals/corrections.
  schedule:
    # Hourly through the main Saturday game window (UTC).
    - cron: '0 16-23 * * 6'
    - cron: '0 0-10 * * 0'
    # Daily refresh on weekdays for late finals and schedule corrections.
    - cron: '0 10 * * 1-5'

  # Allow manual trigger with season parameter
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (e.g., 2026)'
        required: false
        default: '2026'
      force_update:
        description: 'Force update even if no changes'
        required: false
        default: 'false'

env:
  SEASON: 2026
  PYTHON_VERSION: '3.11'

concurrency:
  group: territory-data-update
  cancel-in-progress: false

jobs:
  update-territories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_SEASON: ${{ github.event.inputs.season || '' }}
      INPUT_FORCE_UPDATE: ${{ github.event.inputs.force_update || '' }}
    permissions:
      contents: write  # Allow pushing commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Resolve run parameters
        id: resolve-params
        run: |
          if [ -n "$INPUT_SEASON" ]; then
            season="$INPUT_SEASON"
          else
            season="$SEASON"
          fi

          echo "EFFECTIVE_SEASON=$season" >> "$GITHUB_ENV"
          echo "effective_season=$season" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_FORCE_UPDATE" = "true" ]; then
            force="true"
          else
            force="false"
          fi

          echo "FORCE_UPDATE=$force" >> "$GITHUB_ENV"
          echo "force_update=$force" >> "$GITHUB_OUTPUT"

      - name: Check if it's Saturday game day window
        id: check-day
        run: |
          DAY=$(date -u +%u)  # 1-7, where 6 is Saturday and 7 is Sunday
          HOUR=$(date -u +%H)

          # Saturday game day: Saturday 6pm UTC onwards OR Sunday before 10am UTC
          # This covers 10am PST Saturday through 2am PST Sunday
          if [ "$DAY" -eq 6 ] && [ "$HOUR" -ge 16 ]; then
            echo "is_saturday=true" >> $GITHUB_OUTPUT
            echo "📅 Saturday game day window (late Saturday UTC) - running hourly update"
          elif [ "$DAY" -eq 7 ] && [ "$HOUR" -le 10 ]; then
            echo "is_saturday=true" >> $GITHUB_OUTPUT
            echo "📅 Saturday game day window (early Sunday UTC) - running hourly update"
          else
            echo "is_saturday=false" >> $GITHUB_OUTPUT
            echo "📅 Regular day - running daily update"
          fi

      - name: Ingest game results
        run: |
          cd backend
          echo "🏈 Fetching game results for season $EFFECTIVE_SEASON..."
          python ingest_games.py --season $EFFECTIVE_SEASON --season-type both --provider espn
          echo "✓ Game results ingested"

      - name: Apply territory transfers
        run: |
          cd backend
          echo "🗺️  Applying territory transfers..."
          python apply_transfers.py --season $EFFECTIVE_SEASON
          echo "✓ Territory transfers applied"

      - name: Compute leaderboards
        run: |
          cd backend
          echo "🏆 Computing leaderboards..."
          python compute_leaderboards.py --season $EFFECTIVE_SEASON
          echo "✓ Leaderboards computed"

      - name: Validate generated data
        run: node frontend/scripts/validate-data.mjs

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain frontend/public/data/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📊 Changes detected in data files"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes to commit"
          fi

      - name: Commit and push changes
        if: >
          steps.check-changes.outputs.has_changes == 'true' ||
          steps.resolve-params.outputs.force_update == 'true'
        run: |
          # Get the current week number from the latest ownership file
          LATEST_WEEK=$(ls -1 frontend/public/data/ownership/${EFFECTIVE_SEASON}/ 2>/dev/null | grep -E 'week-[0-9]+\.json$' | sort -V | tail -1 | grep -oP 'week-\K[0-9]+' || echo "unknown")

          # Determine update frequency for commit message
          if [ "${{ steps.check-day.outputs.is_saturday }}" == "true" ]; then
            FREQUENCY="hourly"
          else
            FREQUENCY="daily"
          fi

          git add frontend/public/data/

          git commit \
            -m "Update territories for week ${LATEST_WEEK} (${FREQUENCY} update)" \
            -m "- Ingested latest game results" \
            -m "- Applied territory transfers" \
            -m "- Updated leaderboards" \
            -m "" \
            -m "🤖 Automated update via GitHub Actions" \
            || echo "No changes to commit"

          git push

      - name: Summary
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Update Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Season: $EFFECTIVE_SEASON"
          echo "Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Time (PST): $(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Game day mode: ${{ steps.check-day.outputs.is_saturday }}"
          echo "Changes detected: ${{ steps.check-changes.outputs.has_changes }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Territory update failed. Check workflow logs for details."
